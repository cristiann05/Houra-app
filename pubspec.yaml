name: houra_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  audioplayers: ^6.0.0
  intl: ^0.20.2
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/png/
    - assets/iconos/
    - assets/sounds/
    - assets/logos svg/